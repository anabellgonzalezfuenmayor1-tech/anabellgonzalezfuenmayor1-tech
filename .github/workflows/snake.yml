# Genera la serpiente que se "come" la gráfica de contribuciones, en colores sakura.
# Corre sola cada 12 horas, al subir cambios a main, o a mano desde Actions -> Run workflow.
name: Serpiente sakura

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generar la serpiente con colores de cerezo
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-sakura-dark.svg?color_snake=#ff8fb8&color_dots=#2a1a3d,#5a2f63,#a4517f,#f48fb1,#ffd3df
            dist/snake-sakura-light.svg?color_snake=#d9467a&color_dots=#f6e9f0,#f8c8da,#f48fb1,#d9467a,#8f1f4a

      - name: Publicar los SVG en la rama "output"
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
