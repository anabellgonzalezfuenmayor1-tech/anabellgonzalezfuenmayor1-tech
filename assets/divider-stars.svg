<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 60" width="1200" height="60" role="img" aria-label="divider">
<style>
.t1{animation:tw 3s ease-in-out infinite}
.t2{animation:tw 4.5s ease-in-out infinite}
.t3{animation:tw 6s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.2}50%{opacity:1}}
.sh{opacity:0;animation:shoot 7s linear infinite}
@keyframes shoot{0%{opacity:0;transform:translateX(0)}4%{opacity:1}22%{opacity:0;transform:translateX(420px)}100%{opacity:0;transform:translateX(420px)}}
.pulse{animation:pl 4s ease-in-out infinite}
@keyframes pl{0%,100%{opacity:.75}50%{opacity:1}}
.spark{animation:sp 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes sp{0%,100%{opacity:.35;transform:scale(.7)}50%{opacity:1;transform:scale(1.25)}}
</style>
<defs>
<linearGradient id="l1" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8fd3ff" stop-opacity="0"/><stop offset=".6" stop-color="#8fd3ff" stop-opacity=".85"/><stop offset="1" stop-color="#fff"/></linearGradient>
<linearGradient id="l2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff"/><stop offset=".4" stop-color="#c9a6ff" stop-opacity=".85"/><stop offset="1" stop-color="#c9a6ff" stop-opacity="0"/></linearGradient>
<linearGradient id="tail" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff"/></linearGradient>
<filter id="glow" x="-300%" y="-300%" width="700%" height="700%"><feGaussianBlur stdDeviation="2.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
